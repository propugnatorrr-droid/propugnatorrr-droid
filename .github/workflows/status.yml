name: Launch status board

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status-board
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check every product URL and render the board
        run: node scripts/check-live.ts
      - name: Rebuild README from data files
        run: node scripts/build-readme.ts
      - name: Commit only if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/status.svg data/status.json README.md
          if git diff --cached --quiet; then
            echo "No change, nothing to commit."
            exit 0
          fi
          git commit -m "chore: update launch status board"
          git push
