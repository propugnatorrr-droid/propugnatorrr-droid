<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 812" width="1280" height="812" role="img" aria-labelledby="t d">
<title id="t">Telemetry</title>
<desc id="d">Twelve figures counted from the codebases. CiteWard, an evidence-first medical AI agent: 32 agent tools, 158 API routes, 1,272 commits, 322 test cases with 318 passing. Illyria hotel OS: 114 database tables, 125 page routes, 520 test cases. TextileWays OS: 105 data models, 84 inherited from an MIT-licensed CRM and 21 added. PrepsNext Hub: 23 data models, 18 API routes. Herbiix kitchen agent: 25 AI eval checks. Kynnected: 24 migrations.</desc>
<style>
.sf{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;font-feature-settings:"lnum"}
.ss{font-family:'Helvetica Neue',Helvetica,'Segoe UI',Arial,sans-serif}
.n1{font-size:72px;fill:#F5F2EA}
.n2{font-size:40px;fill:#F5F2EA}
.nm{font-size:24px;fill:#F5F2EA}
.ds{font-size:14px;fill:#8A8A8A}
.lb{font-size:11px;letter-spacing:2.5px;fill:#8A8A8A}
.ix{font-size:12px;letter-spacing:2px;fill:#E08C2C}
.f{animation:f 1s ease-out both}
@keyframes f{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.f{animation:none}}
</style>

<rect width="1280" height="812" fill="#000000"/>

<!-- header -->
<text class="ss" x="64" y="64" font-size="13" letter-spacing="5" fill="#F5F2EA">TELEMETRY</text>
