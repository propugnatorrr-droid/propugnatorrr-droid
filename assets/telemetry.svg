<desc id="d">Twelve figures counted from the codebases. CiteWard: 32 agent tools, 158 API routes, 1,272 commits, 322 test cases with 318 passing. Illyria hotel OS: 114 database tables, 125 page routes, 520 test cases. TextileWays OS: 105 data models, extended from 84 in the inherited MIT-licensed CRM. PrepsNext Hub: 23 data models, 18 API routes. Herbiix kitchen agent: 25 AI eval checks. Kynnected: 24 migrations.</desc>
