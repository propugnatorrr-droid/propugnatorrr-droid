<title id="t">CITEWARD  /  NO-GO REPLAY</title><desc id="d">Animated terminal replay of a real CiteWard trace. Retrieval finds 12 sources, none naming the drug. The reviewer grades the refusal green. The decision is NO-GO: dose withheld.</desc>
