<text class="m l k0" x="32" y="96" xml:space="preserve"><tspan fill="#8C8C8C">$ </tspan><tspan fill="#FFFFFF">POST /api/[redacted]  mode=clinic</tspan></text><text class="m l k1" x="32" y="124" xml:space="preserve"><tspan fill="#E08C2C" font-weight="700">QUERY     </tspan><tspan fill="#FFFFFF">What is the recommended adult dose of zorvaxinol for stage 3 chronic kidney disease?</tspan></text><text class="m l k2" x="32" y="152" xml:space="preserve"><tspan fill="#E08C2C" font-weight="700">T-0  RETRIEVE   </tspan><tspan fill="#FFFFFF">12 sources from pubmed, umls-expanded</tspan></text><text class="m l k3" x="32" y="180" xml:space="preserve"><tspan fill="#8C8C8C">     relevance   </tspan><tspan fill="#E5484D">best 0.486  floor 0.292  pool_off_target=true</tspan></text><text class="m l k4" x="32" y="208" xml:space="preserve"><tspan fill="#E08C2C" font-weight="700">T+1  DRAFT      </tspan><tspan fill="#FFFFFF">5,763 chars, doses in draft: 0</tspan></text><text class="m l k5" x="32" y="236" xml:space="preserve"><tspan fill="#E08C2C" font-weight="700">T+2  REVIEW     </tspan><tspan fill="#FFFFFF">adversarial critic: confidence green, flags 0, get_human false</tspan></text><text class="m l k6" x="32" y="264" xml:space="preserve"><tspan fill="#E08C2C" font-weight="700">T+3  GRADE      </tspan><tspan fill="#FFFFFF">evidence strength strong, 5 of 5 cited sources passed support check</tspan></text><text class="m l k7" x="32" y="292" xml:space="preserve"><tspan fill="#E08C2C" font-weight="700">T+4  ANSWER     </tspan><tspan fill="#FFFFFF">&quot;There is no established adult dose of zorvaxinol for stage 3 CKD.&quot;</tspan></text>
