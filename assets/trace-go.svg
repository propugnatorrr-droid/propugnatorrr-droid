<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-labelledby="t d">
<title id="t">CiteWard GO replay</title>
<desc id="d">Animated replay of a real CiteWard trace captured on 2026-11-08. The question asks for the evidence that SGLT2 inhibitors reduce heart failure hospitalisation in HFpEF. Retrieval finds 60 sources from PubMed, Europe PMC, OpenAlex and UMLS expansion. The draft is 21,367 characters. The adversarial reviewer grades confidence amber with no flags. Six of ten cited sources pass the support check, so the evidence grade is limited. The answer headline still says strong, a known wording gap. The decision is GO: answer with citations, with the weakness stated.</desc>
